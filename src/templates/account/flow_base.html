{% extends "account/base.html" %}
{% load static %}
{% block account_content %}
<section class="mx-auto flex max-w-xl flex-col items-center px-6 py-12 lg:py-16">
  <a href="{% url 'home' %}" class="mb-6 flex items-center text-2xl font-semibold">
    <img class="mr-2 h-8 w-8" src="{% static 'images/logo/tabula-belli-logo.png' %}" alt="">
    Tabula Belli
  </a>
  <div class="w-full rounded-lg border border-border bg-card p-6 shadow sm:p-8">
    <h1 class="mb-6 flex flex-col items-center text-center text-3xl font-extrabold tracking-tight">
      {% block flow_title %}{% endblock %}
      <span class="mt-3 h-[3px] w-16 rounded-full bg-accent"></span>
    </h1>
    <div class="space-y-5 text-muted-foreground">{% block flow_content %}{% endblock %}</div>
  </div>
</section>
{% endblock %}
