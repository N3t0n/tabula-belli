{% extends "account/base.html" %}

{% block head_title %}Set Password{% endblock %}

{% block account_content %}
<div class="mx-auto max-w-xl px-4 py-12">
  <h1 class="mb-6 text-3xl font-bold text-foreground">Set Password</h1>
  {% if is_public_demo_account %}
    {% include "account/_demo_account_notice.html" %}
  {% endif %}
  <form method="post" action="{% url 'account_set_password' %}" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit"
            {% if is_public_demo_account %}disabled aria-disabled="true"{% endif %}
            class="rounded-lg bg-primary-700 px-5 py-2.5 text-sm font-medium text-white disabled:cursor-not-allowed disabled:opacity-50">
      Set Password
    </button>
  </form>
</div>
{% endblock %}
