{% if form.non_field_errors %}
  <div role="alert" class="rounded-lg bg-destructive/10 p-4 text-sm text-destructive">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div>
    <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-medium text-foreground">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div id="{{ field.auto_id }}_helptext" class="mt-2 text-sm text-muted-foreground">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div id="{{ field.auto_id }}_error" role="alert" class="mt-2 text-sm text-destructive">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
