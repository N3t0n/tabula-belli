{% extends "account/base.html" %}

{% block head_title %}Change Password{% endblock %}

{% block account_content %}
<div class="mx-auto max-w-xl px-4 py-12">
  <h1 class="mb-6 text-3xl font-bold text-foreground">Change Password</h1>
  {% if is_public_demo_account %}
    {% include "account/_demo_account_notice.html" %}
  {% endif %}
  <form method="post" action="{% url 'account_change_password' %}" class="space-y-6">
    {% csrf_token %}
    {% include 'account/_flow_fields.html' %}
    <button type="submit"
            {% if is_public_demo_account %}disabled aria-disabled="true"{% endif %}
            class="inline-flex w-full items-center justify-center rounded-lg bg-primary-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-primary-800 focus:outline-none focus:ring-4 focus:ring-primary-300 transition-colors cursor-pointer disabled:cursor-not-allowed disabled:opacity-50 dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800 sm:w-auto">
      Change Password
    </button>
  </form>
</div>
{% endblock %}
