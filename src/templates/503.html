<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Brief maintenance | Tabula Belli</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #091211; color: #e6f5f6; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 600px; padding: clamp(24px, 6vw, 48px); border: 1px solid #253b3a; border-radius: 12px; background: #0e1918; text-align: center; }
    .brand { font-size: 1.5rem; font-weight: 700; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); }
    h1::after { content: ''; display: block; width: 80px; height: 4px; margin: 20px auto; background: #edbd45; border-radius: 4px; }
    p { color: #adcbd1; line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; padding: 14px 24px; background: #0b8393; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
    a:focus-visible { outline: 3px solid #edbd45; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Tabula Belli</div>
    <h1>We'll be back shortly</h1>
    <p>We're refreshing the demo. This usually takes a few minutes.</p>
    <p>Please try again shortly. Thank you for your patience.</p>
    <a href="">Try again</a>
  </main>
</body>
</html>
