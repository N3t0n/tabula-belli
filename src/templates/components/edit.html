<dialog id="edit-dialog" aria-labelledby="edit-dialog-title"
        class="fixed inset-0 m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-2xl overflow-y-auto rounded-lg border border-border bg-card p-0 text-foreground shadow-xl backdrop:bg-black/50">
  <div class="flex items-center justify-between border-b border-border p-4 md:p-5">
    <h2 id="edit-dialog-title" class="text-lg font-semibold">Edit Profile</h2>
    <button type="button" data-modal-close autofocus
            class="btn btn-icon"
            aria-label="Close modal">
      <svg focusable="false" class="h-4 w-4" aria-hidden="true" viewBox="0 0 14 14" fill="none">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
      </svg>
    </button>
  </div>
  <p id="profile-save-error" role="alert" hidden class="mx-4 mt-4 rounded-lg border border-destructive/30 bg-destructive/10 p-3 text-sm text-destructive">
    We couldn't save your changes. Your entries are still here. Please try again.
  </p>
  <div id="modal-content"></div>
</dialog>
