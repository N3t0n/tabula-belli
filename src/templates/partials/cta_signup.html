{% if user.is_authenticated %}
<h2 class="mb-4 text-4xl tracking-tight font-extrabold leading-tight text-foreground inline-flex flex-col items-center w-full">
    Already Registered?
    <span class="inline-block h-[3px] w-16 rounded-full bg-accent mt-3"></span>
</h2>
<p class="mb-6 font-light text-muted-foreground md:text-lg">Check your registrations or create your own event.</p>
<a href="{% url 'my_events:index' %}" class="btn btn-primary mr-2 mb-2">My Events</a>
{% else %}
<h2 class="mb-4 text-4xl tracking-tight font-extrabold leading-tight text-foreground inline-flex flex-col items-center w-full">
    Ready to Play?
    <span class="inline-block h-[3px] w-16 rounded-full bg-accent mt-3"></span>
</h2>
<p class="mb-6 font-light text-muted-foreground md:text-lg">Register at Tabula Belli to enjoy everything we have to offer.</p>
<a href="{% url 'account_signup' %}" class="btn btn-primary mr-2 mb-2">Join Us</a>
{% endif %}
