{% if user.is_authenticated %}
<h2 class="mb-4 text-4xl tracking-tight font-extrabold leading-tight text-foreground inline-flex flex-col items-center w-full">
    Already Registered?
    <span class="inline-block h-[3px] w-16 rounded-full bg-accent mt-3"></span>
</h2>
<p class="mb-6 font-light text-muted-foreground md:text-lg">Check your registrations or create your own event.</p>
<a href="{% url 'my_events:index' %}" class="inline-flex items-center justify-center text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 mr-2 mb-2 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800 transition-colors cursor-pointer">My Events</a>
{% else %}
<h2 class="mb-4 text-4xl tracking-tight font-extrabold leading-tight text-foreground inline-flex flex-col items-center w-full">
    Ready to Play?
    <span class="inline-block h-[3px] w-16 rounded-full bg-accent mt-3"></span>
</h2>
<p class="mb-6 font-light text-muted-foreground md:text-lg">Register at Tabula Belli to enjoy everything we have to offer.</p>
<a href="{% url 'account_signup' %}" class="inline-flex items-center justify-center text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 mr-2 mb-2 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800 transition-colors cursor-pointer">Join Us</a>
{% endif %}
