<header>
    <nav class="bg-card border-border px-4 lg:px-6 py-2.5 dark:bg-card">
        <div class="grid grid-cols-[auto_1fr] items-center gap-x-2 mx-auto max-w-screen-xl lg:flex lg:flex-wrap lg:justify-between">
            <a href="/" class="inline-flex min-h-11 min-w-11 shrink-0 items-center justify-center gap-3" aria-label="Tabula Belli home">
                {% load static %}
                <img src="{% static 'images/logo/tabula-belli-logo.png' %}" class="h-8 w-8 sm:h-9 sm:w-9" alt="" />
                <span class="hidden self-center text-xl font-semibold whitespace-nowrap dark:text-foreground min-[520px]:inline">Tabula Belli</span>
            </a>
            <div class="flex shrink-0 items-center justify-self-end gap-1 sm:gap-2 lg:order-2">
                <button id="theme-toggle" type="button" aria-label="Toggle color theme" class="btn btn-icon">
                    <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>

                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}" class="btn btn-text-secondary btn-nav max-[320px]:hidden {% if request.resolver_match.namespace == 'accounts' %}bg-muted{% endif %}">Profile</a>
                    <form method="post" action="{% url 'account_logout' %}" class="flex max-[320px]:hidden">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-secondary btn-nav max-[320px]:hidden">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url "account_login" %}" class="btn btn-text-secondary btn-nav max-[320px]:hidden">Log in</a>
                    <a href="{% url "account_signup" %}" class="btn btn-primary btn-nav max-[320px]:hidden">Sign Up</a>
                {% endif %}
                    
                <button data-collapse-toggle="mobile-menu-2" type="button" class="btn btn-icon lg:hidden" aria-controls="mobile-menu-2" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
                    <svg class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            <div class="hidden col-span-2 justify-between items-center w-full lg:flex lg:w-auto lg:order-1" id="mobile-menu-2">
                <ul class="flex flex-col mt-4 font-medium lg:flex-row lg:space-x-8 lg:mt-0">
                    <li>
                        <a href="{% url 'home' %}" class="block py-2 pr-4 pl-3 {% if request.resolver_match.url_name == 'home' %}text-white rounded bg-primary-700 lg:bg-transparent lg:text-primary-700{% else %}text-foreground border-b border-border hover:bg-muted lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700{% endif %} lg:p-0 {% if request.resolver_match.url_name == 'home' %}dark:text-white{% else %}dark:text-muted-foreground lg:dark:hover:text-foreground dark:hover:bg-muted dark:hover:text-foreground lg:dark:hover:bg-transparent dark:border-border{% endif %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>Home</a>
                    </li>
                    <li>
                        <a href="{% url 'events' %}" class="block py-2 pr-4 pl-3 {% if request.resolver_match.url_name == 'events' or request.resolver_match.url_name == 'event_detail' %}text-white rounded bg-primary-700 lg:bg-transparent lg:text-primary-700{% else %}text-foreground border-b border-border hover:bg-muted lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700{% endif %} lg:p-0 {% if request.resolver_match.url_name == 'events' or request.resolver_match.url_name == 'event_detail' %}dark:text-white{% else %}dark:text-muted-foreground lg:dark:hover:text-foreground dark:hover:bg-muted dark:hover:text-foreground lg:dark:hover:bg-transparent dark:border-border{% endif %}" {% if request.resolver_match.url_name == 'events' or request.resolver_match.url_name == 'event_detail' %}aria-current="page"{% endif %}>Events</a>
                    </li>
                    <li>
                        <a href="{% url 'my_events:index' %}" class="block py-2 pr-4 pl-3 {% if 'my_events' in request.resolver_match.namespace|default:'' %}text-white rounded bg-primary-700 lg:bg-transparent lg:text-primary-700{% else %}text-foreground border-b border-border hover:bg-muted lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700{% endif %} lg:p-0 {% if 'my_events' in request.resolver_match.namespace|default:'' %}dark:text-white{% else %}dark:text-muted-foreground lg:dark:hover:text-foreground dark:hover:bg-muted dark:hover:text-foreground lg:dark:hover:bg-transparent dark:border-border{% endif %}" {% if 'my_events' in request.resolver_match.namespace|default:'' %}aria-current="page"{% endif %}>My Events</a>
                    </li>
                    <li>
                        <a href="{% url 'about' %}" class="block py-2 pr-4 pl-3 {% if request.resolver_match.url_name == 'about' %}text-white rounded bg-primary-700 lg:bg-transparent lg:text-primary-700{% else %}text-foreground border-b border-border hover:bg-muted lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700{% endif %} lg:p-0 {% if request.resolver_match.url_name == 'about' %}dark:text-white{% else %}dark:text-muted-foreground lg:dark:hover:text-foreground dark:hover:bg-muted dark:hover:text-foreground lg:dark:hover:bg-transparent dark:border-border{% endif %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About Us</a>
                    </li>                
                    <li>
                        <a href="{% url 'contact' %}" class="block py-2 pr-4 pl-3 {% if request.resolver_match.url_name == 'contact' %}text-white rounded bg-primary-700 lg:bg-transparent lg:text-primary-700{% else %}text-foreground border-b border-border hover:bg-muted lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700{% endif %} lg:p-0 {% if request.resolver_match.url_name == 'contact' %}dark:text-white{% else %}dark:text-muted-foreground lg:dark:hover:text-foreground dark:hover:bg-muted dark:hover:text-foreground lg:dark:hover:bg-transparent dark:border-border{% endif %}" {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}>Contact</a>
                    </li>
                    <li class="min-[321px]:hidden border-t border-border mt-2 pt-2">
                        {% if user.is_authenticated %}
                            <a href="{% url 'accounts:profile' %}" class="btn btn-text-secondary justify-start">Profile</a>
                            <form method="post" action="{% url 'account_logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-text-secondary w-full justify-start">Logout</button>
                            </form>
                        {% else %}
                            <a href="{% url 'account_login' %}" class="btn btn-text-secondary justify-start">Log in</a>
                            <a href="{% url 'account_signup' %}" class="btn btn-text-secondary justify-start">Sign Up</a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
