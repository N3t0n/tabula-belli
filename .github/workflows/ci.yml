name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python, PostgreSQL and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: tabula_belli_ci
          POSTGRES_USER: tabula_belli_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabula_belli_ci -d tabula_belli_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-7xQ9-mV2-pL8-rT4-kN6-sD3-fH5-zC1-wB0-not-production
      DJANGO_ENV: development
      DEBUG: "False"
      LOG_LEVEL: INFO
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
      DB_NAME: tabula_belli_ci
      DB_USER: tabula_belli_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSLMODE: disable

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies and CI tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install coverage==7.15.4 pip-audit==2.10.1

      - name: Check Python dependencies
        run: python -m pip check

      - name: Audit Python dependencies
        run: python -m pip_audit --strict

      - name: Run Django checks and migrations
        run: |
          python src/manage.py check
          python src/manage.py makemigrations --check --dry-run
          python src/manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=src --omit='*/migrations/*','*/test*.py','*/manage.py','*/wsgi.py','*/asgi.py' src/manage.py test -v 2
          python -m coverage report --show-missing
          python -m coverage erase

      - name: Install and audit frontend dependencies
        run: |
          npm ci
          npm ls --depth=0
          npm audit

      - name: Build frontend assets
        run: npm run build

      - name: Test contact submission lifecycle without network requests
        run: node --test scripts/tests/contact.test.cjs

      - name: Collect production static files
        env:
          DJANGO_ENV: production
          RESEND_API_KEY: ci-placeholder-not-used
        run: python src/manage.py collectstatic --clear --noinput

      - name: Check production configuration
        env:
          DJANGO_ENV: production
          RESEND_API_KEY: ci-placeholder-not-used
        run: python src/manage.py check --deploy

      - name: Verify repository cleanliness
        run: git diff --exit-code
